<script>
'use strict';
const view=document.getElementById('view'),toastEl=document.getElementById('toast');
const GROUPS=[{id:'I1',name:'Pantai Bilangan',icon:'🏖️',desc:'Membaca dan menulis bilangan'},{id:'I2',name:'Gua Nilai Tempat',icon:'💎',desc:'Ratusan, puluhan, satuan'},{id:'I3',name:'Jembatan Urutan',icon:'🌉',desc:'Membandingkan dan mengurutkan'},{id:'I4',name:'Benteng Hitung',icon:'🏰',desc:'Penjumlahan dan pengurangan'},{id:'I5',name:'Peti Harta',icon:'🎁',desc:'Perkalian dan pembagian'}];
let parentReportData=null,parentSelectedStudent='';
let mode='home',adminToken=localStorage.getItem('ma_admin')||'',teacherCode=localStorage.getItem('ma_tcode')||'',studentSession=readLocal('ma_student'),roomState=null,studentData=null,questionIndex=0,localAnswer=null,selectedTiles=[],busy=false,pollHandle=null,polling=false,resultTimer=null,serverOffset=0,submitting=false;
// Server Google Apps Script (Web App /exec) diatur pada config.js.
const API_URL=String(window.APP_CONFIG&&window.APP_CONFIG.API_URL||'').trim(),API_READY=/^https:\/\/\S+\/exec$/.test(API_URL);
function readLocal(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(e){return null;}}
function x(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function notify(msg,bad=false){toastEl.textContent=msg;toastEl.style.background=bad?'#a94834':'#163f46';toastEl.classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>toastEl.classList.add('hidden'),4000);}
function networkError(msg){const e=new Error(msg);e.network=true;return e;}
// text/plain = "simple request" sehingga browser tidak mengirim preflight CORS yang tidak didukung Apps Script.
async function call(name,...args){
 if(!API_READY)throw new Error('Server ujian belum diatur. Guru perlu mengisi API_URL (URL Web App berakhiran /exec) pada file config.js.');
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),45000);let res=null,data;
 try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:name,args}),signal:ctrl.signal});data=await res.json();}
 catch(e){throw networkError(ctrl.signal.aborted?'Server terlalu lama merespons. Coba lagi sebentar lagi.':res?'Respons server tidak valid. Coba lagi; jika terus terjadi, guru perlu memeriksa deployment Apps Script.':'Tidak dapat terhubung ke server ujian. Periksa koneksi internet, lalu coba lagi.');}
 finally{clearTimeout(timer);}
 if(!data||data.ok!==true)throw new Error(data&&data.error||'Terjadi kesalahan pada server.');
 return data.result;
}
function loader(t='Menghubungkan ke pulau...'){view.innerHTML=`<div class="panel" style="text-align:center;padding:50px 15px"><div class="emoji-large">⛵</div><h2>${x(t)}</h2><p class="subtle">Memuat data dari server ujian</p></div>`;}
function button(label,action,extra=''){return `<button class="btn ${extra}" data-action="${action}">${label}</button>`;}
function loadingError(e){notify(e.message||String(e),true);}

function parentHeader(data,s,pageno){
 return `<div class="parent-head"><div><span class="parent-mark">MATH ADVENTURE · MISI PULAU 1000</span><h1>LEMBAR SOAL & HASIL PTS</h1><p>Matematika Kelas 3 SD · Bab 1: Bilangan Cacah sampai 1.000</p></div><div class="parent-page-no">Dokumen untuk Orang Tua / Wali<br>Halaman ${pageno} dari 4</div></div>
 <div class="parent-info"><p><b>Nama siswa:</b> ${x(s.name)}</p><p><b>No. peserta:</b> ${x(s.no)}</p><p><b>Ruang:</b> ${x(data.room.code)}</p><p><b>Selesai:</b> ${x(s.completedAt)}</p></div>`;

function parentOneQuestion(q,a){
 const answered=!!a&&!!a.answered;
 const raw=answered?a.value:null;
 let content='';
 if(q.type==='choice'||q.type==='symbol'){
   content=`<div class="parent-options ${q.type==='symbol'?'symbol':''}">${q.options.map((op,i)=>{
     const picked=answered&&String(raw)===String(op);
     return `<div class="parent-option ${picked?'selected':''}"><span class="parent-choicebox ${picked?'picked':''}" aria-label="${picked?'Disilang oleh siswa':'Tidak dipilih'}"></span><span class="parent-option-letter">${q.type==='symbol'?'':String.fromCharCode(65+i)+'.'}</span><span class="parent-option-copy">${x(op)}</span></div>`;
   }).join('')}</div>`;
 }else if(q.type==='number'){
   if(q.stack)content+=`<div class="parent-stack"><div>${x(q.stack.top)}</div><div>${x(q.stack.symbol)} ${x(q.stack.bottom)}</div></div>`;
   content+=`<div class="parent-writearea"><span>Jawaban siswa:</span><span class="answer-ink ${answered?'':'no-answer'}">${answered?x(a.studentAnswer):'Belum diisi'}</span></div>`;
 }else if(q.type==='sequence'||q.type==='order'){
   content+=`<div class="parent-tiles">Kartu yang tersedia: ${q.tiles.map(t=>`<span class="parent-tile">${x(t)}</span>`).join('')}</div>`;
   content+=`<div class="parent-writearea"><span>Susunan siswa:</span><span class="answer-ink ${answered?'':'no-answer'}">${answered?x(a.studentAnswer):'Belum disusun'}</span></div>`;
 }
 const verdict=a&&a.correct?'✓ Benar':answered?'✗ Perlu diperbaiki':'— Tidak dijawab';
 return `<article class="parent-question"><div class="parent-question-head"><span class="parent-qnum">${String(q.number).padStart(2,'0')}</span><div class="parent-prompt">${x(q.prompt)}</div></div>
 ${content}<div class="parent-check"><span><b>Kunci jawaban:</b> ${x(q.answerKey)}</span><strong class="${a&&a.correct?'right':'wrong'}">${verdict}</strong></div></article>`;
}
function renderParentStudent(data,s){
 const lookup=Object.fromEntries(s.answers.map(a=>[a.id,a]));
 return PARENT_PRINT_PARTS.map((part,index)=>{
   const pageno=index+1;
   const questions=data.questions.slice(part.start,part.end);
   const section=`<section class="parent-paper" aria-label="Laporan ${x(s.name)} halaman ${pageno}">${parentHeader(data,s,pageno)}
     <div class="parent-section-title">A. Lembar soal terisi · Nomor ${String(part.start+1).padStart(2,'0')}–${String(part.end).padStart(2,'0')}</div>
     ${questions.map(q=>parentOneQuestion(q,lookup[q.id])).join('')}`;
   if(pageno!==4)return section+`<p class="parent-small">Tanda silang pada kotak menandai jawaban siswa; jawaban angka/kartu disalin dari server, bukan tulisan tangan siswa.</p></section>`;
   const recos=s.recommendations.slice(0,4);
   const scoreBlock=`<div class="parent-result ${s.passed?'':'fail'}"><strong>${s.score}</strong><div><span><b>${s.passed?'TUNTAS':'BELUM TUNTAS'}</b> (nilai minimal ${data.minScore})</span><br><span>${s.correctCount} dari ${data.questionCount} soal benar · 5 poin/butir</span></div></div>`;
   return section+`<div class="parent-section-title">B. Hasil penilaian</div>${scoreBlock}
     <div class="parent-section-title">C. Analisis penguasaan materi</div>
     <table class="parent-tbl"><colgroup><col style="width:55%"><col style="width:15%"><col style="width:15%"><col style="width:15%"></colgroup>
     <thead><tr><th>Indikator</th><th>Benar</th><th>Capaian</th><th>Catatan</th></tr></thead><tbody>
     ${s.indicatorResults.map(r=>`<tr><td>${x(r.name)}</td><td>${r.correct}/${r.total}</td><td>${r.percentage}%</td><td>${r.mastery?'Cukup baik*':'Perlu latihan*'}</td></tr>`).join('')}</tbody></table>
     <p class="parent-small">*Acuan indikator 75% untuk petunjuk awal. Penguasaan dinilai lebih lanjut oleh guru.</p>
     <div class="parent-section-title">D. Saran tindak lanjut</div><ol class="parent-recos">${recos.map(r=>`<li>${x(r)}</li>`).join('')}</ol>
     <p class="parent-small">Catatan guru: ..........................................................................................................................</p>
     <div class="parent-signatures"><div><p>Guru kelas / mapel</p><span>Nama dan tanda tangan</span></div><div><p>Orang tua / wali</p><span>Nama dan tanda tangan</span></div></div>
     <div class="parent-report-notice">Dokumen pribadi untuk komunikasi guru dan orang tua. Soal dicetak dalam urutan baku; urutan pengerjaan siswa dapat berbeda.</div></section>`;
 }).join('');
}

function statusTag(status){return status==='waiting'?'<span class="tag orange">⏳ Ruang Menunggu</span>':status==='live'?'<span class="tag">🟢 Sedang Berlangsung</span>':'<span class="tag red">🔒 Ditutup</span>';}
async function enterStudent(){if(!studentSession)return renderStudentEntry();mode='student';loader('Mengantarkan ke pulau...');try{studentData=await call('studentState',studentSession.code,studentSession.token);serverOffset=studentData.serverTime-Date.now();if(studentData.result){renderResult();}else{questionIndex=Math.max(0,Math.min(questionIndex,studentData.questions.length-1));renderStudent();}startPoll();}catch(e){if(e.network){studentData=null;renderStudentOffline();startPoll();notify(e.message,true);return;}studentSession=null;localStorage.removeItem('ma_student');renderStudentEntry();notify(e.message,true);}}
// Gangguan jaringan tidak menghapus token siswa; polling akan membuka soal lagi saat koneksi pulih.
function renderStudentOffline(){view.innerHTML=`<div class="panel" style="text-align:center;max-width:600px;margin:auto"><div class="emoji-large">📡</div><h1 class="section-title">Koneksi ke server terputus</h1><p class="subtle">Tenang, sesi <b>${x(studentSession.name)}</b> masih tersimpan di HP ini dan jawaban yang sudah tersimpan tidak hilang. Halaman akan mencoba tersambung lagi secara otomatis.</p>${button('↻ Coba lagi','resumeStudent','')}</div>`;}
function answerVal(q){const stored=studentData.answers[q.id];return stored===undefined?null:stored;}
function renderStudent(){mode='student';if(!studentData)return loader();const d=studentData,r=d.room;
 if(d.result)return renderResult();if(r.status==='waiting'){
 view.innerHTML=`<div class="panel" style="text-align:center;max-width:630px;margin:auto"><div class="emoji-large">⛵</div><h1>Selamat datang, ${x(d.student.name)}!</h1><p class="subtle">Kamu sudah terdaftar di ruang <b>${x(r.code)}</b>. Ujian akan dimulai bersamaan ketika guru menekan tombol Mulai.</p><div class="callout">📚 20 soal · 40 menit · KKM 75 · Kerjakan sendiri dengan jujur.</div><div class="spacer"></div>${button('↻ Cek mulai ujian','refreshStudent','alt')}</div>`;return;}
 const qs=d.questions;if(!qs.length)return loader();const q=qs[questionIndex];const count=Object.keys(d.answers).length;localAnswer=answerVal(q);selectedTiles=(Array.isArray(localAnswer)?localAnswer.slice():[]);
 const group=GROUPS.find(g=>g.id===q.indicator)||GROUPS[0];const currentGroupIndex=GROUPS.findIndex(g=>g.id===q.indicator);
 view.innerHTML=`<section class="hero" style="min-height:110px;padding:19px 17px"><h1 style="font-size:25px;margin-bottom:5px">${x(group.icon)} ${x(group.name)}</h1><p style="font-size:13px">${x(group.desc)}</p></section>
 <div class="map">${GROUPS.map((g,i)=>`<div class="map-step ${i===currentGroupIndex?'active':i<currentGroupIndex?'done':''}"><div class="emoji">${g.icon}</div><small>${x(g.name)}</small></div>`).join('')}</div>
 <div class="panel"><div class="question-top"><div><span class="tag">Soal ${questionIndex+1} / ${qs.length}</span> <span class="tag orange">⭐ 5 poin</span></div><div id="studentCountdown" class="countdown">--:--</div></div>
 <div class="ring"><i style="width:${count*5}%"></i></div><p class="mini">${count} dari 20 soal sudah tersimpan di server</p>
 <div class="question"><span class="tag">${x(q.difficulty)}</span><h2>${x(q.prompt)}</h2><div id="answerArea">${renderAnswerArea(q)}</div></div>
 <div class="action-bar">${button('← Sebelumnya','prevQuestion','alt')}${button('Lewati →','skipQuestion','alt')}${button('💾 Simpan & lanjut →','saveNext','')}</div><div class="spacer"></div><div class="mini" style="margin-bottom:8px">Pilih nomor untuk meninjau soal. Nomor hijau sudah tersimpan.</div><div class="question-nav">${qs.map((n,i)=>`<button class="nav-number ${d.answers[n.id]!==undefined?'answered':''} ${i===questionIndex?'active':''}" data-action="jumpQuestion" data-index="${i}">${i+1}</button>`).join('')}</div><div class="toolbar"><span class="mini" id="saveInfo">${localAnswer===null?'Belum dijawab':'Jawaban sebelumnya tersimpan'}</span>${button('📦 Kumpulkan Ujian','submitExam','warn small')}</div></div>`;
 updateClock();}
function renderAnswerArea(q){const a=localAnswer;
 if(q.type==='number')return `${q.stack?`<div class="stack-calc" aria-label="Operasi hitung bersusun"><div>${q.stack.top}</div><div>${q.stack.symbol} ${q.stack.bottom}</div></div>`:''}<p class="subtle">Ketik jawaban berupa angka saja.</p><input id="numericAnswer" class="field number-box" type="number" inputmode="numeric" min="0" max="9999" pattern="[0-9]*" value="${a==null?'':x(a)}" placeholder="?" aria-label="Jawaban angka">`;
 if(q.type==='choice'||q.type==='symbol')return `<div class="option-grid" ${q.type==='symbol'?'style="grid-template-columns:repeat(3,1fr)"':''}>${q.options.map((op,i)=>`<button class="option ${a===op?'selected':''}" data-action="chooseOption" data-value="${x(op)}" aria-pressed="${a===op}">${q.type==='symbol'?`<span style="font-size:29px">${x(op)}</span>`:`<span class="letter">${'ABCD'[i]}</span>${x(op)}`}</button>`).join('')}</div>`;
 if(q.type==='sequence'||q.type==='order'){const rem=q.tiles.filter(t=>!selectedTiles.includes(t));return `<p class="mini">Ketuk kartu di bawah sesuai urutan yang benar. Ketuk kartu pada baris jawaban untuk membatalkan.</p><div id="selectedTiles" class="ordered">${selectedTiles.length?selectedTiles.map((v,i)=>`<button class="chip" style="background:white" data-action="removeTile" data-index="${i}">${i+1}. ${x(v)} ✕</button>`).join(''):'<span class="mini">Ketuk kartu untuk menyusun jawaban...</span>'}</div><div class="chip-row">${rem.map(t=>`<button class="chip" data-action="addTile" data-value="${x(t)}">${x(t)}</button>`).join('')}</div><p class="mini" style="text-align:center">${selectedTiles.length}/${q.tiles.length} kartu dipilih</p>`;}
 return '<p>Jenis soal tidak dikenali.</p>';}
function repaintAnswer(){const q=studentData.questions[questionIndex];document.getElementById('answerArea').innerHTML=renderAnswerArea(q);}
async function saveCurrent(move=true){if(busy)return;const q=studentData.questions[questionIndex];let val;
 if(q.type==='number'){const field=document.getElementById('numericAnswer');val=field.value.trim();if(!/^\d{1,4}$/.test(val))return notify('Masukkan jawaban berupa angka yang benar.',true);val=Number(val);}
 else if(q.type==='choice'||q.type==='symbol'){val=localAnswer;if(!q.options.includes(val))return notify('Pilih salah satu jawaban dahulu.',true);}
 else{val=selectedTiles.slice();if(val.length!==q.tiles.length)return notify('Susun semua kartu sebelum menyimpan.',true);}
 busy=true;document.querySelectorAll('button').forEach(el=>{if(el.dataset.action==='saveNext')el.disabled=true;});
 try{const status=await call('studentSaveAnswer',studentSession.code,studentSession.token,q.id,val);studentData.answers[q.id]=val;studentData.student.answered=status.answered;
 const info=document.getElementById('saveInfo');if(info)info.textContent='✅ Tersimpan di server';if(move){questionIndex=(questionIndex+1)%studentData.questions.length;renderStudent();}else{notify('Jawaban tersimpan!');renderStudent();}}
 catch(e){notify(e.message,true);if(/waktu.*habis|ditutup/i.test(e.message))await enterStudent();}finally{busy=false;}
}
function renderResult(){mode='result';const data=studentData,r=data.result;
 view.innerHTML=`<div class="panel feedback" style="max-width:760px;margin:auto"><div class="emoji-large">${r.passed?'🏆':'🌱'}</div><h1 class="section-title">Petualangan Selesai!</h1><p>Terima kasih, <b>${x(data.student.name)}</b>. Jawabanmu sudah diperiksa server.</p><div class="report-score ${r.passed?'':'notpassed'}"><div><strong>${r.score}</strong><span style="display:block">dari 100 poin</span></div></div><span class="tag ${r.passed?'':'orange'}">${r.passed?'✅ TUNTAS':'📚 BELUM TUNTAS'}</span><h2>${r.passed?'Hebat, kamu mencapai nilai minimal!':'Tetap semangat belajar!'}</h2><p>Nilai minimal 75 · ${r.correct} benar dari 20 soal</p><hr class="line"><h3 style="text-align:left">Peta kemampuanmu</h3>${r.indicators.map((g,i)=>`<div style="text-align:left;margin:13px 0"><div class="toolbar"><span style="font-size:13px;font-weight:750">${GROUPS[i].icon} ${x(g.name)}</span><span class="mini">${g.correct}/${g.total} benar</span></div><div class="ring"><i style="width:${Math.round(g.correct/g.total*100)}%"></i></div></div>`).join('')}
 <div class="callout ${r.passed?'':'warn'}" style="text-align:left"><b>${r.recommendations.length?'Saran latihan berikutnya:':'Saran pengayaan:'}</b><br>${x(r.recommendations.slice(0,2).join(' ')||'Latih soal cerita dan penalaran agar makin mahir.')}</div><div class="spacer"></div><p class="mini">Lembar nilai lengkap dan analisis tersedia pada dashboard guru. ${r.reason==='WAKTU_HABIS'?'Ujian dikumpulkan otomatis karena waktu berakhir.':''}</p><div class="callout">🔄 Kamu sudah keluar dari ujian. Halaman masuk untuk siswa berikutnya terbuka dalam <b id="nextCountdown">60</b> detik.</div><div class="spacer"></div>${button('Selesai, ganti siswa berikutnya →','nextStudent','')}</div>`;
 // HP dipakai bergantian: hasil sudah final, jadi sesi siswa dihapus agar siswa berikutnya tidak melihat hasil ini.
 studentSession=null;localStorage.removeItem('ma_student');clearInterval(pollHandle);pollHandle=null;
 clearInterval(resultTimer);let left=60;resultTimer=setInterval(()=>{const el=document.getElementById('nextCountdown');if(mode!=='result'||!el)return clearInterval(resultTimer);el.textContent=--left;if(left<=0)nextStudent();},1000);}
function nextStudent(){clearInterval(resultTimer);studentData=null;questionIndex=0;renderStudentEntry();}
function updateClock(){let ends=0;if(mode==='teacher'&&roomState&&roomState.room)ends=roomState.room.endsAt;else if(mode==='student'&&studentData)ends=studentData.room.endsAt;if(!ends)return;
 const seconds=Math.max(0,Math.ceil((ends-(Date.now()+serverOffset))/1000)),txt=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 const el=document.getElementById(mode==='teacher'?'teacherCountdown':'studentCountdown');if(el){el.textContent=txt;el.classList.toggle('danger',seconds<300);}}
function startPoll(){clearInterval(pollHandle);pollHandle=setInterval(async()=>{
 if(busy||submitting||polling||document.hidden)return;polling=true;
 try{if(mode==='teacher'&&teacherCode&&adminToken){roomState=await call('teacherRoomState',adminToken,teacherCode);serverOffset=roomState.serverTime-Date.now();renderTeacher();}
 else if((mode==='student'||mode==='result')&&studentSession){const fresh=await call('studentState',studentSession.code,studentSession.token);serverOffset=fresh.serverTime-Date.now();const prevStatus=studentData&&studentData.room.status;const oldAnswered=studentData?studentData.answers:{};studentData=fresh;
 if(fresh.result&&mode!=='result')renderResult();else if(mode==='student'&&(prevStatus!==fresh.room.status)){renderStudent();}
 else if(mode==='student'){studentData.answers=Object.assign({},fresh.answers,oldAnswered);updateClock();}
 }
 }catch(e){/* jaringan mungkin putus; coba lagi pada polling berikutnya */}finally{polling=false;}
 },8000);}
setInterval(updateClock,1000);
// One centralized UI event listener, avoiding inline Javascript event attributes.
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 try{
 if(a==='home')return goHome();if(a==='nextStudent')return nextStudent();if(a==='studentEntry')return renderStudentEntry();if(a==='teacherEntry')return adminToken?enterDashboard():renderTeacherEntry();
 if(a==='logoutTeacher'){adminToken='';teacherCode='';roomState=null;localStorage.removeItem('ma_admin');localStorage.removeItem('ma_tcode');return goHome();}
 if(a==='resumeStudent')return enterStudent();
 if(a==='refreshStudent')return enterStudent();
 if(a==='refreshTeacher')return enterDashboard();
 if(a==='copyCode'){try{await navigator.clipboard.writeText(teacherCode);notify('Kode disalin.');}catch(e){notify('Salin kode secara manual: '+teacherCode);}return;}
 if(a==='startExam'){if(!confirm('Mulai ujian sekarang? Setiap siswa mendapat 40 menit sejak ia mulai, dan siswa lain tetap bisa bergabung setelahnya.'))return;busy=true;await call('teacherStartRoom',adminToken,teacherCode);busy=false;notify('Ujian dimulai!');return enterDashboard();}
 if(a==='closeExam'){if(!confirm('Tutup ujian sekarang? Siswa yang belum mengumpulkan akan dinilai sesuai jawaban tersimpan.'))return;busy=true;await call('teacherCloseRoom',adminToken,teacherCode);busy=false;notify('Ruang ditutup.');return enterDashboard();}
 if(a==='parentReports'){
   busy=true;b.disabled=true;notify('Mengambil laporan individu dari server...');
   const data=await call('teacherParentReports',adminToken,teacherCode);
   parentReportData=data;parentSelectedStudent=data.students[0].id;
   busy=false;clearInterval(pollHandle);pollHandle=null;renderParentPrint();return;
 }
 if(a==='printParentReports'){if(!parentReportData)return;window.print();return;}
 if(a==='backTeacher'){parentReportData=null;return enterDashboard();}
 if(a==='exportReport'){busy=true;b.disabled=true;notify('Menyusun laporan di Google Sheets...');const result=await call('teacherReport',adminToken,teacherCode);busy=false;b.disabled=false;const holder=document.getElementById('reportLinks');if(holder)holder.innerHTML=`<div class="panel"><h3>📊 Laporan berhasil dibuat (${result.count} siswa)</h3><p>${button('Buka Google Spreadsheet','openSheet','alt')} ${result.excelUrl?button('Unduh file Excel (.xlsx)','openExcel',''):''}</p><p class="mini">File milik akun Google guru. Hanya pemilik yang dapat membukanya secara default.</p>${result.excelError?`<p class="subtle">Ekspor .xlsx otomatis tidak tersedia: ${x(result.excelError)}. Buka Sheet → File → Download → Microsoft Excel.</p>`:''}</div>`;
 window.__reportUrls={sheet:result.spreadsheetUrl,excel:result.excelUrl};return;}
 if(a==='openSheet')return window.open(window.__reportUrls.sheet,'_blank');
 if(a==='openExcel')return window.open(window.__reportUrls.excel,'_blank');
 if(a==='chooseOption'){localAnswer=b.dataset.value;return repaintAnswer();}
 if(a==='addTile'){selectedTiles.push(b.dataset.value);localAnswer=selectedTiles.slice();return repaintAnswer();}
 if(a==='removeTile'){selectedTiles.splice(Number(b.dataset.index),1);localAnswer=selectedTiles.slice();return repaintAnswer();}
 if(a==='prevQuestion'){questionIndex=Math.max(0,questionIndex-1);return renderStudent();}
 if(a==='skipQuestion'){questionIndex=(questionIndex+1)%studentData.questions.length;return renderStudent();}
 if(a==='jumpQuestion'){questionIndex=Number(b.dataset.index);return renderStudent();}
 if(a==='saveNext')return saveCurrent(true);
 if(a==='submitExam'){
   const answered=Object.keys(studentData.answers).length;
   if(!confirm(`Kumpulkan ujian sekarang? ${answered} dari 20 soal tersimpan. Jawaban yang sedang diketik tetapi belum disimpan tidak akan dinilai.`))return;
   submitting=true;const r=await call('studentSubmit',studentSession.code,studentSession.token);studentData.result=r.result;submitting=false;return renderResult();
 }
 }catch(e){busy=false;submitting=false;b.disabled=false;loadingError(e);}
});
document.addEventListener('change',ev=>{if(ev.target.id==='parentStudentSelect'){parentSelectedStudent=ev.target.value;renderParentPrint();}});
document.addEventListener('submit',async ev=>{const form=ev.target;if(!['joinForm','teacherForm','createForm','openRoomForm'].includes(form.id))return;ev.preventDefault();if(busy)return;busy=true;try{
 if(form.id==='joinForm'){const code=document.getElementById('joinCode').value.trim().toUpperCase(),no=document.getElementById('joinNo').value,name=document.getElementById('joinName').value;studentSession=await call('studentJoin',code,no,name);localStorage.setItem('ma_student',JSON.stringify(studentSession));questionIndex=0;return enterStudent();}
 if(form.id==='teacherForm'){const pass=document.getElementById('teacherPass').value;const r=await call('teacherLogin',pass);adminToken=r.token;localStorage.setItem('ma_admin',adminToken);return enterDashboard();}
 if(form.id==='createForm'){const title=document.getElementById('roomTitle').value;const r=await call('teacherCreateRoom',adminToken,title);teacherCode=r.code;localStorage.setItem('ma_tcode',teacherCode);roomState=await call('teacherRoomState',adminToken,teacherCode);notify('Ruang '+teacherCode+' dibuat. Bagikan kode ke siswa.');renderTeacher();startPoll();return;}
 if(form.id==='openRoomForm'){teacherCode=document.getElementById('openCode').value.trim().toUpperCase();localStorage.setItem('ma_tcode',teacherCode);return enterDashboard();}
 }catch(e){loadingError(e);}finally{busy=false;}});
if(studentSession){enterStudent();}else if(adminToken){enterDashboard();}else{renderHome();}
</script></body></html>
